name: Build DreamSkin.exe

on:
  push:
    branches: [main, fix/runnable]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check scripts
        shell: pwsh
        run: |
          Get-ChildItem src/cherry -Recurse -Filter *.mjs -Exclude node_modules | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE) { exit 1 } }
      - name: Build single exe
        shell: pwsh
        run: ./src/DreamSkinMaster/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DreamSkin
          path: src/DreamSkinMaster/DreamSkin.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/DreamSkinMaster/DreamSkin.exe
